<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center - Secure Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        }
        
        .login-header {
            margin-bottom: 35px;
        }
        
        .login-logo {
            font-size: 45px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4));
        }
        
        .login-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, var(--primary-light), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .login-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 22px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
        }
        
        .input-wrapper input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 15px 12px 45px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .input-wrapper input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-light);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.2);
        }
        
        .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.4);
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 25px;
            position: relative;
        }
        
        .auth-tab {
            flex: 1;
            padding: 10px 15px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            user-select: none;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .auth-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        
        .input-group-confirm {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-bottom: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .input-group-confirm.show {
            max-height: 100px;
            opacity: 1;
            margin-bottom: 22px;
        }

        .input-group-options {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 22px;
            font-size: 13px;
        }
        
        .remember-me-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            user-select: none;
            transition: color 0.3s ease;
        }
        
        .remember-me-label:hover {
            color: white;
        }
        
        .remember-me-label input {
            cursor: pointer;
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="gradient-1"></div>
        <div class="gradient-2"></div>
    </div>
    
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <i class="fas fa-satellite-dish"></i>
            </div>
            <h1>COMMAND CENTER</h1>
            <p id="header-desc">Access secure monitoring dashboard</p>
        </div>

        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login" onclick="setMode('login')">Sign In</div>
            <div class="auth-tab" id="tab-register" onclick="setMode('register')">Register</div>
        </div>
        
        <div id="error-box" class="error-message">
            <i class="fas fa-exclamation-circle"></i>
            <span id="error-text">Invalid login credentials</span>
        </div>
        
        <form id="login-form">
            <div class="input-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">
                </div>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">
                </div>
            </div>

            <div class="input-group-options" id="remember-me-group">
                <label class="remember-me-label">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    <span>Remember Me</span>
                </label>
            </div>

            <div class="input-group input-group-confirm" id="confirm-password-group">
                <label for="confirm-password">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-check-double"></i>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" autocomplete="new-password">
                </div>
            </div>
            
            <button type="submit" class="submit-btn" id="submit-btn">
                <span id="submit-btn-text">SIGN IN</span>
                <i class="fas fa-arrow-right" id="submit-btn-icon"></i>
            </button>
        </form>
    </div>

    <script>
        let currentMode = 'login';

        function setMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const confirmGroup = document.getElementById('confirm-password-group');
            const confirmInput = document.getElementById('confirm-password');
            const rememberGroup = document.getElementById('remember-me-group');
            const submitBtnText = document.getElementById('submit-btn-text');
            const headerDesc = document.getElementById('header-desc');
            const errorBox = document.getElementById('error-box');
            
            errorBox.style.display = 'none';
            
            if (mode === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                confirmGroup.classList.remove('show');
                confirmInput.removeAttribute('required');
                rememberGroup.style.display = 'flex';
                submitBtnText.textContent = 'SIGN IN';
                headerDesc.textContent = 'Access secure monitoring dashboard';
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                confirmGroup.classList.add('show');
                confirmInput.setAttribute('required', 'required');
                rememberGroup.style.display = 'none';
                submitBtnText.textContent = 'CREATE ACCOUNT';
                headerDesc.textContent = 'Create a new local account';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorBox = document.getElementById('error-box');
            const errorText = document.getElementById('error-text');
            
            errorBox.style.display = 'none';
            
            const payload = {
                username: usernameInput,
                password: passwordInput
            };
            
            if (currentMode === 'register') {
                const confirmPasswordInput = document.getElementById('confirm-password').value;
                if (passwordInput !== confirmPasswordInput) {
                    errorText.textContent = 'Passwords do not match';
                    errorBox.style.display = 'flex';
                    return;
                }
                
                if (passwordInput.length < 6) {
                    errorText.textContent = 'Password must be at least 6 characters';
                    errorBox.style.display = 'flex';
                    return;
                }
            } else {
                const rememberMe = document.getElementById('remember-me').checked;
                payload.remember = rememberMe;
                if (rememberMe) {
                    localStorage.setItem('remembered_username', usernameInput);
                } else {
                    localStorage.removeItem('remembered_username');
                }
            }
            
            const endpoint = currentMode === 'login' ? '/api/auth/login' : '/api/auth/register';
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === 'ok') {
                    window.location.href = '/';
                } else {
                    errorText.textContent = data.message || 'Authentication failed';
                    errorBox.style.display = 'flex';
                }
            } catch (err) {
                errorText.textContent = 'Server connection error';
                errorBox.style.display = 'flex';
            }
        });

        // Prefill remembered username
        document.addEventListener('DOMContentLoaded', () => {
            const remembered = localStorage.getItem('remembered_username');
            if (remembered) {
                const usernameField = document.getElementById('username');
                const rememberCheckbox = document.getElementById('remember-me');
                if (usernameField) usernameField.value = remembered;
                if (rememberCheckbox) rememberCheckbox.checked = true;
            }
        });
    </script>
</body>
</html>
